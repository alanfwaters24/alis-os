<!doctype html>
<html lang="en-GB" class="alis-glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab · PANE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="alis_glass_theme.css">
<style>
  /* PANE start page: ALIS Glass (alis-core/alis_glass_theme.css) + a few page-only bits. */
  html, body { margin: 0; min-height: 100%; background: var(--alis-bg); color: var(--alis-text);
    font-family: var(--font-body); }
  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 9vh 24px 40px; }
  .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 6px;
    font-family: var(--font-display); letter-spacing: .32em; font-size: 13px; color: var(--alis-text-dim); }
  .brand b { color: var(--alis-teal-bright); font-weight: 700; }
  #clock { text-align: center; font-family: var(--font-mono); font-size: clamp(56px, 9vw, 96px); line-height: 1;
    color: var(--alis-text); text-shadow: 0 0 24px rgba(45, 212, 191, .25); }
  #date { text-align: center; color: var(--alis-text-dim); font-size: 18px; margin: 8px 0 28px; letter-spacing: .04em; }
  form { display: flex; justify-content: center; margin: 0 auto 38px; max-width: 640px; }
  #q { flex: 1; font: 500 20px var(--font-body); color: var(--alis-text); padding: 16px 22px; border-radius: 999px;
    background: linear-gradient(180deg, var(--glass-grad-top), var(--glass-grad-bottom));
    border: 1px solid var(--glass-border); outline: none; box-shadow: inset 0 1px 0 var(--glass-inset-highlight);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)); }
  #q:focus { border-color: var(--alis-teal); box-shadow: 0 0 0 3px rgba(45, 212, 191, .18); }
  #q::placeholder { color: var(--alis-text-dim); }
  h2.section { font-family: var(--font-display); font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--alis-text-dim); margin: 0 0 12px 4px; font-weight: 600; }
  a.glass-card { display: block; text-decoration: none; color: inherit; padding: 16px 18px; min-height: 64px; cursor: pointer; }
  .tile-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--alis-text); }
  .tile-about { font-size: 14px; color: var(--alis-text-dim); margin-top: 4px; line-height: 1.3; }
  .tile-dot { float: right; width: 8px; height: 8px; border-radius: 50%; background: var(--alis-text-dim); margin-top: 6px; }
  .tile-dot.up { background: var(--alis-teal-bright); box-shadow: 0 0 8px var(--alis-teal); }
  .tile-dot.down { background: var(--alis-danger); }
  footer { text-align: center; color: var(--alis-text-dim); font-size: 12px; margin-top: 34px; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="alis-glow-layer"></div>
<main>
  <div class="brand"><b>PANE</b> · PERSONAL ALIS NETWORK EXPLORER</div>
  <div id="clock">--:--</div>
  <div id="date"></div>
  <form action="https://duckduckgo.com/" method="get" autocomplete="off">
    <input id="q" name="q" placeholder="Search the web, or type an address" autofocus>
  </form>
  <h2 class="section">ALIS</h2>
  <div class="alis-grid" id="tiles"></div>
  <footer>Searches go to DuckDuckGo · ALIS links come from ALIS OS</footer>
</main>
<script src="links.js"></script>
<script>
  // Clock + greeting (UK formats).
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    const h = d.getHours(), hi = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    document.getElementById('date').textContent = hi + ' · ' +
      d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick(); setInterval(tick, 10000);

  // Typed an address rather than a search? Go straight there.
  document.querySelector('form').addEventListener('submit', e => {
    const v = document.getElementById('q').value.trim();
    if (/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(v) && !/\s/.test(v)) {
      e.preventDefault(); location.href = /^https?:/i.test(v) ? v : 'https://' + v;
    }
  });

  // Does an address answer? (no-cors: we only learn "reachable or not", nothing else)
  function reachable(url, ms) {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), ms || 2500);
    return fetch(url, { mode: 'no-cors', signal: c.signal, cache: 'no-store' })
      .then(() => true, () => false).finally(() => clearTimeout(t));
  }

  // ALIS module tiles: home network address first, Tailscale when away.
  const grid = document.getElementById('tiles');
  (window.ALIS_LINKS || []).forEach(m => {
    const a = document.createElement('a');
    a.className = 'glass-card span-3'; a.href = m.url;
    a.innerHTML = '<span class="tile-dot"></span><div class="tile-name"></div><div class="tile-about"></div>';
    a.querySelector('.tile-name').textContent = m.name;
    a.querySelector('.tile-about').textContent = m.about;
    grid.appendChild(a);
    const dot = a.querySelector('.tile-dot');
    reachable(m.url).then(ok => {
      if (ok) { dot.classList.add('up'); return; }
      if (!m.fallback) { dot.classList.add('down'); return; }
      return reachable(m.fallback, 4000).then(ok2 => {
        dot.classList.add(ok2 ? 'up' : 'down');
        if (ok2) a.href = m.fallback;
      });
    });
  });
</script>
</body>
</html>
